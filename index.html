<style>

  .timeline{display:flex;margin:22px 0 6px;counter-reset:s}
  .step{flex:1;position:relative;padding:14px 6px 0;text-align:center}
  .step::before{counter-increment:s;content:counter(s);position:relative;z-index:2;display:grid;place-items:center;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--muted);font-weight:800;font-size:13px}
  .step::after{content:"";position:absolute;top:29px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1}
  .step:first-child::after{display:none}
  .step .t{font-size:12.5px;font-weight:700;color:var(--muted)}
  .step.done::before{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.done::after{background:var(--accent)}

  .cnt{font-size:11.5px;color:var(--muted);text-align:right;margin-top:4px}

  .pill span{display:inline-block;padding:9px 15px;border:1px solid var(--line);border-radius:100px;font-size:14px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;transition:.15s}

  .err{background:#fbeeea;border:1px solid #f0cabd;color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px;margin:10px 0;line-height:1.5}
  .ok{background:#eaf6f0;border:1px solid #bfe4d0;color:#1c6b45;border-radius:10px;padding:12px 14px;font-size:14px;margin:10px 0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .spacer{flex:1}

  .chipf{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:100px;background:rgba(0,0,0,.08);color:#2a3835}

  /* 입력 확인 모달 */

  .chk{width:18px;height:18px;accent-color:var(--brand);padding:0}
  .rankcard{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}

  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px;align-items:start;margin-top:22px;padding:10px 6px 6px}
  .note{position:relative;border-radius:3px;padding:30px 22px 20px;cursor:pointer;color:#1f2b28;box-shadow:0 8px 18px rgba(18,48,43,.16),0 2px 4px rgba(18,48,43,.10);transition:transform .18s ease,box-shadow .18s ease}
  .note:nth-child(5n+1){background:#fdf3c0;transform:rotate(-1.5deg)}
  .note:nth-child(5n+2){background:#d6f1e2;transform:rotate(1.1deg)}
  .note:nth-child(5n+3){background:#ffdfe6;transform:rotate(-.7deg)}
  .note:nth-child(5n+4){background:#dbeaff;transform:rotate(1.6deg)}
  .note:nth-child(5n+5){background:#ecdcff;transform:rotate(-1.1deg)}
  .note:hover{transform:rotate(0) translateY(-5px);box-shadow:0 18px 34px rgba(18,48,43,.22);z-index:2}
  .note.on{transform:rotate(0) translateY(-3px);box-shadow:0 20px 40px rgba(47,122,111,.3);outline:3px solid var(--brand);z-index:3}
  .note .pin{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 12%,#e0574f 46%,#a5322c 100%);box-shadow:0 3px 5px rgba(0,0,0,.32)}
  .note .check{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.18);background:rgba(255,255,255,.55);display:grid;place-items:center;color:transparent;font-weight:900;font-size:14px;transition:.15s}
  .note.on .check{background:var(--brand);border-color:var(--brand);color:#fff}
  .note h3{display:inline;margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.02em;line-height:1.55;background:linear-gradient(transparent 62%,rgba(0,0,0,.07) 0)}
  .note .one{margin:12px 0 12px;font-size:14px;line-height:1.6;color:#2a3835;font-weight:600}

  .note .nt{display:block;font-size:13.5px;line-height:1.55;color:#28322f}

  .demo{background:#fff6dc;border-bottom:1px solid #f1dd9a;color:#7a5a00;font-size:12.5px;text-align:center;padding:7px 12px}
  footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px;line-height:1.6}
</style>

<script>

const FIELDS = [
  { key:"교육·역량강화", desc:"사회복지사의 전문성과 현장 실무능력을 높이는 교육 및 학습에 관한 제안입니다.",

window.addEventListener("hashchange",render);
window.addEventListener("DOMContentLoaded",()=>{ if(DEMO) $("#demoBar").classList.remove("hidden"); render(); });
async function render(){
  const route=location.hash.replace("#",""), view=$("#view");
  try{ if(!STATE.config) STATE.config=(await apiGet("config")).config; }
  catch(e){ view.innerHTML=`<div class="card pad"><div class="err">서버 연결에 실패했습니다. GAS_URL과 배포 상태를 확인해 주세요.</div></div>`; return; }
  if(route==="apply") return viewApply(view);
  if(route==="vote") return viewVote(view);
  if(route==="judge") return viewJudge(view);
  if(route==="admin") return viewAdmin(view);
  return viewHome(view);
}
function stageTimeline(cur){
  const steps=["신청","심사","투표","종료"], labels={"신청":"제안 접수","심사":"위원회 심사","투표":"회원 투표","종료":"결과 발표"};
  const idx=steps.indexOf(cur);
  return `<div class="timeline">${steps.map((s,i)=>`<div class="step ${i<idx?"done":""} ${i===idx?"active":""}"><div class="t">${labels[s]}</div></div>`).join("")}</div>`;
}
function secttl(n,t){ return `<div class="secttl"><span class="n">${n}</span><h2>${t}</h2></div>`; }

  form.addEventListener("input",e=>{
    const t=e.target;
    if(t.tagName==="TEXTAREA"){ const k=t.id.replace("f_",""); const c=$("#cnt_"+k); if(c) c.textContent=t.value.length+"자"; }
    const w=t.closest(".f, .chkrow"); if(w) w.classList.remove("bad");
    saveDraftDebounced();
  });
  form.addEventListener("change",e=>{
    const t=e.target;
    if(t.type==="file"){ const f=t.files[0]; const m=$("#fileMsg");
      if(!f){ PENDING_FILE=null; m.textContent="선택된 파일 없음"; return; }
      if(f.size>5*1024*1024){ PENDING_FILE=null; t.value=""; m.innerHTML=`<span style="color:var(--warn)">5MB 이하 파일만 첨부할 수 있습니다.</span>`; return; }
      PENDING_FILE=f; m.textContent=`${f.name} (${(f.size/1024).toFixed(0)}KB)`; return; }
    const w=t.closest(".f, .chkrow"); if(w) w.classList.remove("bad");
    saveDraftDebounced();
  });
}

/* 임시저장 */
let draftTimer=null;
function saveDraftDebounced(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,500); }
function collectApply(){
  const d={};
  APPLICANT.forEach(([k])=>d[k]=($("#f_"+k)||{}).value||"");
  PROPOSAL.forEach(([k,type])=>{ if(type==="radio"){ const r=document.querySelector('input[name="제안분야"]:checked'); d[k]=r?r.value:""; } else if(type!=="file"){ d[k]=($("#f_"+k)||{}).value||""; } });
  d.회비납부확인=$("#c_회비납부확인")?.checked?"Y":"";
  CONSENTS.forEach(([k])=>d[k]=$("#c_"+k)?.checked?"Y":"");
  return d;
}
function saveDraft(){
  try{ const d=collectApply(); d._ts=Date.now(); localStorage.setItem(DRAFT_KEY,JSON.stringify(d)); showDraftBar(d._ts); }catch(e){}
}
function restoreDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY); if(!raw) { showDraftBar(null); return; }
    const d=JSON.parse(raw);
    Object.keys(d).forEach(k=>{
      if(k==="_ts") return;
      if(k==="제안분야"){ const r=document.querySelector(`input[name="제안분야"][value="${CSS.escape(d[k])}"]`); if(r) r.checked=true; return; }
      const cb=$("#c_"+k); if(cb){ cb.checked=d[k]==="Y"; return; }
      const el=$("#f_"+k); if(el&&el.type!=="file"){ el.value=d[k]; const c=$("#cnt_"+k); if(c) c.textContent=(d[k]||"").length+"자"; }
    });
    showDraftBar(d._ts);
  }catch(e){}
}
function showDraftBar(ts){
  const b=$("#draftBar"); if(!b) return;
  b.innerHTML = ts ? `임시저장됨 · ${new Date(ts).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} <a onclick="clearDraft()">임시저장 삭제</a>` : `작성 중인 내용은 이 기기에 자동 임시저장됩니다.`;
}
function clearDraft(){ if(!confirm("임시저장된 내용을 삭제하고 입력칸을 비울까요?")) return; localStorage.removeItem(DRAFT_KEY); viewApply($("#view")); }

/* 검증 → 입력내용 확인 모달 */
function validateApply(d){
  const miss=[];
  const mark=k=>{ const w=document.querySelector(`.f[data-k="${k}"]`)||$("#row_"+k); if(w) w.classList.add("bad"); miss.push(LABEL[k]||k); };
  APPLICANT.forEach(([k,,req])=>{ if(req&&!d[k].trim()) mark(k); });
  if(d.생년월일.trim() && d.생년월일.replace(/\D/g,"").length!==6){ const w=document.querySelector('.f[data-k="생년월일"]'); if(w) w.classList.add("bad"); miss.push("생년월일(6자리)"); }
  if(d.회비납부확인!=="Y") mark("회비납부확인");
  PROPOSAL.forEach(([k,type,req])=>{ if(req && type!=="file" && !String(d[k]).trim()) mark(k); });
  CONSENTS.forEach(([k,t])=>{ if(d[k]!=="Y"){ const w=$("#row_"+k); if(w) w.classList.add("bad"); miss.push(t); } });
  return miss;
}
function openReview(){
  const d=collectApply();
  document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
  const miss=validateApply(d);
  const m=$("#applyMsg");
  if(miss.length){
    m.innerHTML=`<div class="err"><b>다음 필수항목을 확인해 주세요.</b><br>${miss.map(esc).join(" · ")}</div>`;
    const first=document.querySelector(".bad"); if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  m.innerHTML="";
  const rows=[["신청자",`${d.성명} · ${d.생년월일} · ${d.휴대전화} · ${d.이메일}${d.소속기관?` · ${d.소속기관}`:""}`]]
    .concat(PROPOSAL.filter(p=>p[1]!=="file").map(([k])=>[LABEL[k],d[k]]))
    .concat([["참고자료",PENDING_FILE?PENDING_FILE.name:"(첨부 없음)"],["확인·동의","회비납부 확인 / 개인정보 / 제안 공개 / 제출내용 / 선정 후 활용 — 모두 확인"]]);
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="reviewModal";
  bg.innerHTML=`<div class="modal">
    <div class="eyebrow">제출 전 확인</div><h2 style="margin:6px 0 2px">입력내용을 확인해 주세요</h2>
    <p class="hint" style="margin:0 0 6px">수정이 필요하면 「수정하기」를 눌러 돌아갈 수 있습니다.</p>
    <dl class="rv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v?nl(v):"-"}</dd>`).join("")}</dl>
    <div id="submitMsg"></div>
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn" id="submitBtn" onclick="submitApply()">제출하기</button><button class="btn ghost" onclick="closeReview()">수정하기</button></div>
  </div>`;
  document.body.appendChild(bg);
}
function closeReview(){ const m=$("#reviewModal"); if(m) m.remove(); }

function readFileB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function submitApply(){
  const d=collectApply(); const btn=$("#submitBtn"); btn.disabled=true; btn.innerHTML='<span class="spin"></span> 제출 중';
  const payload={action:"submitApplication",...d};
  if(PENDING_FILE){ try{ payload.file={name:PENDING_FILE.name,mime:PENDING_FILE.type,data:await readFileB64(PENDING_FILE)}; }catch(e){} }
  const r=await apiPost(payload);
  if(r.ok){
    localStorage.removeItem(DRAFT_KEY); PENDING_FILE=null; closeReview();
    $("#view").innerHTML=`<div class="card pad center" style="padding:52px 26px">
      <div class="badge" style="margin:0 auto"><span class="pip"></span>접수 완료</div>
      <h1 style="margin-top:16px">접수가 완료되었습니다</h1>
      <dl class="info" style="max-width:420px;margin:18px auto 24px;text-align:left">
        <div><dt>접수번호</dt><dd><b>${esc(r.id)}</b></dd></div>
        <div><dt>사업명</dt><dd>${esc(r.제안사업명||d.제안사업명)}</dd></div>
        <div><dt>접수일시</dt><dd>${esc(r.접수일시||new Date().toLocaleString("ko-KR"))}</dd></div>
      </dl>
      <p class="muted" style="font-size:14px">접수번호를 기억해 두세요. 심사 결과는 협회 안내를 확인해 주세요.</p>
      <button class="btn" onclick="go('')">처음으로</button>
    </div>`; window.scrollTo(0,0);
  }else{ btn.disabled=false; btn.textContent="제출하기"; $("#submitMsg").innerHTML=`<div class="err">${esc(r.error||"제출에 실패했습니다.")}</div>`; }
}

  const members=[["김서울","850312"],["이복지","900707"],["박나눔","780925"],["최사랑","950101"],["정열매","881230"]];
  return {stage:"신청",items,judges,scores,finalists,votes,members,N:5};
})();
function demoResults(){
  const f=DEMO_DB.finalists; if(!f.length) return [];
  const avg={},vc={}; f.forEach(id=>{ const s=Object.values(DEMO_DB.scores[id]||{}); avg[id]=s.length?s.reduce((a,b)=>a+b,0)/s.length:0; vc[id]=DEMO_DB.votes.filter(v=>v.신청ID===id).length; });
  const mA=Math.max(0,...f.map(id=>avg[id])), mV=Math.max(0,...f.map(id=>vc[id]));
  const r2=n=>Math.round(n*100)/100;
  const rows=f.map(id=>{ const it=DEMO_DB.items.find(i=>i.신청ID===id); const jp=mA?avg[id]/mA*50:0, vp=mV?vc[id]/mV*50:0;
    return {신청ID:id,제안사업명:it.제안사업명,제안분야:it.제안분야,한줄소개:it.한줄소개,심사평균:r2(avg[id]),득표수:vc[id],심사점수:r2(jp),투표점수:r2(vp),최종점수:r2(jp+vp)}; }).sort((a,b)=>b.최종점수-a.최종점수);
  rows.forEach((r,i)=>{ r.순위=i+1; r.시상=i<3?(i+1)+"위":(i<5?"장려상":""); }); return rows;
}
async function mockApi(action,b){
  await new Promise(r=>setTimeout(r,250)); const D=DEMO_DB;
  const cfg={행사명:"2026 회원참여예산제 (미리보기)",단계:D.stage,본선개수:D.N};
  switch(action){
    case "config": return {ok:true,config:cfg};
    case "submitApplication": { const id="P"+Date.now().toString().slice(-8); D.items.push(Object.assign({신청ID:id,_base:70,참고자료:b.file?"(데모) "+b.file.name:""},b)); return {ok:true,id,제안사업명:b.제안사업명,접수일시:new Date().toLocaleString("ko-KR")}; }
    case "judgeLogin": { if(String(b.code)!=="1001"&&String(b.code)!=="1002"&&String(b.code)!=="1003") return {ok:false,error:"코드가 올바르지 않습니다. (데모: 1001)"}; const name="심사위원"+String(b.code).slice(-1);
      return {ok:true,심사위원명:name,stage:D.stage,items:D.items.map(it=>Object.assign({},it,{내점수:(D.scores[it.신청ID]||{})[name]??""}))}; }
    case "saveScore": (D.scores[b.appId]=D.scores[b.appId]||{})[b.judge]=Number(b.score); return {ok:true};
    case "adminData": { if(b.password!=="admin1234") return {ok:false,error:"관리자 비밀번호가 올바르지 않습니다. (데모: admin1234)"};
      const apps=D.items.map(it=>{ const s=Object.values(D.scores[it.신청ID]||{}); const sum=s.reduce((a,c)=>a+c,0); return {신청ID:it.신청ID,제안사업명:it.제안사업명,제안분야:it.제안분야,성명:it.성명,소속기관:it.소속기관,채점수:s.length,총점:sum,평균:s.length?Math.round(sum/s.length*100)/100:0,본선:D.finalists.includes(it.신청ID)}; }).sort((a,b)=>b.평균-a.평균);
      return {ok:true,config:cfg,judgeCount:3,applications:apps,finalists:D.finalists,voteTotal:D.votes.length,results:demoResults()}; }
    case "exportData": { const H=["신청ID","제안사업명","제안분야","한줄소개","성명","소속기관","배경및필요성","참여대상및예상인원","주요내용및운영방법","기존사업차별점","기대효과","예상추진시기","예상소요예산"];
      return {ok:true,신청내역:[H].concat(D.items.map(it=>H.map(h=>it[h]||""))),심사집계:[["신청ID","제안사업명","평균"]].concat(D.items.map(it=>{const s=Object.values(D.scores[it.신청ID]||{});return [it.신청ID,it.제안사업명,s.length?s.reduce((a,c)=>a+c,0)/s.length:""]})),투표집계:[["신청ID","득표수"]].concat(D.finalists.map(id=>[id,D.votes.filter(v=>v.신청ID===id).length]))}; }
    case "setFinalists": D.finalists=b.ids||[]; return {ok:true};
    case "setStage": D.stage=b.stage; return {ok:true,stage:b.stage};
    case "ballot": return {ok:true,items:D.stage!=="투표"?[]:D.finalists.map(id=>D.items.find(i=>i.신청ID===id)).filter(Boolean)};
    case "results": return {ok:true,results:demoResults()};
    case "verifyMember": { const n=String(b.name||"").replace(/\s/g,""), bd=String(b.birth||""); if(!D.members.some(m=>m[0]===n&&m[1]===bd)) return {ok:false,error:"회비납부 회원 명단에서 확인되지 않습니다. (데모: 김서울/850312)"}; if(D.votes.some(v=>v.성명===n&&v.생년월일===bd)) return {ok:false,error:"이미 투표에 참여하셨습니다."}; return {ok:true}; }
    case "submitVote": { const v=await mockApi("verifyMember",b); if(!v.ok) return v; D.votes.push({성명:String(b.name).replace(/\s/g,""),생년월일:b.birth,신청ID:b.appId}); return {ok:true}; }
    default: return {ok:false,error:"알 수 없는 요청"};
  }
}
